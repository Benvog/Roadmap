<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vektor test page</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<!--
  Runs the real app with a stand-in store (tests/fake-store.js): no sign-in, nothing saved.
  ?areas=empty   start with no areas (the default is Career, Health, Money, Mental)
  ?seed=1        put a KES 100,000 target with two paths in Money
  ?seed=2        the same, plus milestones and tasks on Remote work
  ?fail=1        every load and save fails, like having no connection
  ?theme=dark    or light
-->
<main id="app"></main>
<script type="module">
import { startApp } from '../js/app.js';
import { createFakeStore } from './fake-store.js';

const params = new URLSearchParams(location.search);
if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
const store = createFakeStore({
  areas: params.get('areas') === 'empty' ? [] : ['Career', 'Health', 'Money', 'Mental'],
  failing: params.get('fail') === '1',
});
const seed = Number(params.get('seed') || 0);
if (seed >= 1) {
  // A few goals in Money, so there is something to look at without clicking through the forms.
  const money = store.rows('areas').find((a) => a.name === 'Money');
  const target = await store.add('goals', { area_id: money.id, parent_id: null, name: 'Make KES 100,000', target_amount: 100000, unit: 'KES', position: 0 });
  const remote = await store.add('goals', { area_id: money.id, parent_id: target.id, name: 'Remote work', target_amount: null, unit: 'KES', position: 0 });
  await store.add('goals', { area_id: money.id, parent_id: target.id, name: 'Trading', target_amount: null, unit: 'KES', position: 1 });
  await store.add('entries', { goal_id: remote.id, amount: '12000.00', note: 'First gig' });
}
if (seed >= 2) {
  const remote = store.rows('goals').find((g) => g.name === 'Remote work');
  const stop = (name, position, more = {}) => store.add('milestones', { goal_id: remote.id, name, position, done_at: null, due_date: null, fund_amount: null, ...more });
  await stop('Pick a niche', 0, { done_at: '2026-10-01T09:00:00Z' });
  await stop('Build profile & samples', 1, { done_at: '2026-10-05T09:00:00Z' });
  const gigs = await stop('Apply to 5 gigs a week', 2, { due_date: '2026-11-15' });
  await stop('Land first client', 3);
  await stop('Earn KES 20,000 a month', 4);
  await store.add('tasks', { milestone_id: gigs.id, name: 'Shortlist 5 gigs', position: 0, done_at: '2026-10-10T09:00:00Z' });
  await store.add('tasks', { milestone_id: gigs.id, name: 'Write the proposals', position: 1, done_at: null });
  await store.add('tasks', { milestone_id: gigs.id, name: 'Send and log them', position: 2, done_at: null });
}
store.calls.length = 0;
window.fakeStore = store;
window.stopApp = startApp(document.getElementById('app'), { id: 'fake-user', email: 'you@example.com' }, store);
</script>
</body>
</html>
