<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap: journey road (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .app { max-width: 460px; margin: 0 auto; padding: 12px 16px 60px; }
  header { display: flex; align-items: center; gap: 10px; }
  header .title { flex: 1; min-width: 0; }
  header .kicker { font-size: 12.5px; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }

  .chips { display: flex; gap: 8px; margin: 14px -16px 0; padding: 2px 16px 6px; overflow-x: auto; scrollbar-width: none; }
  .chips a {
    flex: none; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: none;
  }
  .chips a[aria-current] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .progress { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .progress-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .progress-row b { font-weight: 800; }
  .progress-row span { color: var(--muted); }
  .progress .bar { margin-top: 8px; }

  .road { position: relative; margin-top: 8px; }
  .road > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .road > svg path { fill: none; stroke: var(--track); stroke-width: 14; stroke-linecap: round; }
  .road > svg path.done { stroke: var(--accent); }
  .road > svg path.dash { stroke: var(--surface); stroke-width: 2; stroke-dasharray: 2 12; }

  .stop {
    position: absolute; display: flex; align-items: center; gap: 12px;
    padding: 0; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 30px;
  }
  .stop.right { flex-direction: row-reverse; text-align: right; }
  .stop .dot {
    flex: none; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 3px solid var(--track); font-weight: 800; color: var(--muted);
  }
  .stop .dot svg { width: 22px; height: 22px; }
  .stop.done .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .stop.next .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 7px var(--accent-soft); animation: here 2s ease-in-out infinite; }
  .stop.locked .dot { background: var(--track); border-style: dashed; border-color: var(--muted); }
  @keyframes here { 50% { box-shadow: 0 0 0 12px var(--accent-soft); } }
  @media (prefers-reduced-motion: reduce) { .stop.next .dot { animation: none; } }
  .stop b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .stop small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
  .stop.next small { color: var(--accent); font-weight: 700; }

  .finish { position: absolute; transform: translateX(-50%); text-align: center; width: 240px; }
  .finish .dot {
    width: 60px; height: 60px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 3px solid var(--track); color: var(--muted);
  }
  .finish.reached .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .finish b { display: block; font-size: 14.5px; font-weight: 800; }
  .finish small { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="icon-btn" id="back" href="areas-map.html" aria-label="Back"></a>
    <div class="title"><p class="kicker" id="kicker"></p><h1 id="title"></h1></div>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark theme"></button>
  </header>
  <nav class="chips" id="chips" aria-label="Goals"></nav>
  <div class="progress" id="progress"></div>
  <div class="road" id="road"></div>
</div>

<script src="data.js"></script>
<script src="base.js"></script>
<script>
document.getElementById('theme').innerHTML = ICONS.moon;
document.getElementById('back').innerHTML = ICONS.back;
const FROM_MAP = PARAMS.get('from') === 'map';
if (FROM_MAP) document.getElementById('back').href = 'map.html?mode=both';

const { goal, area, parent } = findGoal(PARAMS.get('goal') || 'remote');
const GAP = 118, TOP = 64;

document.getElementById('kicker').textContent = area.name + (parent ? ' · ' + parent.name : '');
document.getElementById('title').textContent = goal.name;
document.getElementById('chips').innerHTML = allGoals().map((x) =>
  `<a href="road.html?goal=${x.goal.id}${FROM_MAP ? '&from=map' : ''}" ${x.goal === goal ? 'aria-current="page"' : ''}>${x.goal.name}</a>`).join('');

function render() {
  const steps = goal.steps, n = steps.length;
  const done = steps.filter((s) => s.done).length;
  document.getElementById('progress').innerHTML = `<div class="progress-row"><b>${done} of ${n} milestones</b>
    <span>${goal.earned !== undefined ? KES(goal.earned) + ' earned' : percent(steps) + '%'}</span></div>
    <span class="bar"><i style="width:${percent(steps)}%"></i></span>`;

  const road = document.getElementById('road');
  const W = road.clientWidth, H = TOP + n * GAP + 110;
  const pts = steps.map((s, i) => ({ x: W * (i % 2 ? 0.74 : 0.26), y: TOP + i * GAP }));
  pts.push({ x: W / 2, y: TOP + n * GAP });
  const seg = (a, b) => `M${a.x},${a.y} C${a.x},${a.y + GAP / 2} ${b.x},${b.y - GAP / 2} ${b.x},${b.y}`;

  let svg = '', html = '';
  for (let i = 0; i < n; i++) {
    const d = seg(pts[i], pts[i + 1]);
    svg += `<path class="${steps[i].done ? 'done' : ''}" d="${d}"/><path class="dash" d="${d}"/>`;
  }
  steps.forEach((s, i) => {
    const state = stepState(goal, i), right = i % 2;
    const inner = { done: ICONS.check, locked: ICONS.lock, next: ICONS.dot, todo: i + 1 }[state];
    const sub = state === 'next' ? 'You are here'
      : state === 'locked' ? 'Locked · ' + KES(funded(s)) + ' of ' + KES(s.fund.need)
      : STATE_LABEL[state];
    const side = right ? `right:${W - pts[i].x - 30}px` : `left:${pts[i].x - 30}px`;
    html += `<button class="stop ${state} ${right ? 'right' : ''}" data-i="${i}" style="${side};top:${pts[i].y - 30}px;max-width:${W * 0.74 + 20}px">
      <span class="dot">${inner}</span><span><b>${s.t}</b><small>${sub}</small></span></button>`;
  });
  const end = pts[n];
  html += `<div class="finish ${done === n ? 'reached' : ''}" style="left:${end.x}px;top:${end.y - 30}px">
    <div class="dot">${ICONS.flag}</div><b>${goal.name}</b>
    <small>${parent ? 'Feeds: ' + parent.name : done === n ? 'Goal reached' : 'Finish line'}</small></div>`;

  const focused = document.activeElement?.dataset?.i;
  road.style.height = H + 'px';
  road.innerHTML = `<svg width="${W}" height="${H}" aria-hidden="true">${svg}</svg>${html}`;
  if (focused !== undefined) road.querySelector(`[data-i="${focused}"]`)?.focus({ preventScroll: true });
}

document.getElementById('road').addEventListener('click', (e) => {
  const i = e.target.closest('.stop')?.dataset.i;
  if (i !== undefined) openSheet(goal, +i, render);
});
addEventListener('resize', render);
render();
if (PARAMS.get('sheet')) openSheet(goal, +PARAMS.get('sheet'), render);
</script>
</body>
</html>
