async function open(query, page = 'app') {
  const loaded = new Promise((r) => f.addEventListener('load', r, { once: true }));

  for (let i = 0; i < 50 && !d.querySelector('.node, .card'); i++) await wait(100);
  const q = (sel) => d.querySelector(sel);
  const tap = (sel) => { const el = q(sel); if (!el) throw new Error('nothing matches ' + sel); el.click(); };
  const node = (id) => '[data-id="' + id + '"]:not(.leaving)';
  const ids = () => [...d.querySelectorAll('.node:not(.leaving)')].map((n) => n.dataset.id.replace(/fake-(\d+)/, 'a$1')).join(' ');

  const zoom = () => q('#world').style.transform.match(/scale\(([^)]+)\)/)?.[1];
  const sheet = () => { const s = q('.sheet'); return s && !s.hidden ? s : null; };
  // The node of a given kind whose text contains `text`, and a way to tap it or a small node hanging from it.
  const find = (sel, text) => [...d.querySelectorAll(sel)].find((el) => !el.classList.contains('leaving') && el.textContent.includes(text));
  const tapNode = (sel, text, suffix = '') => { const el = find(sel, text); if (!el) throw new Error('no ' + sel + ' with ' + text); tap(node(el.dataset.id + suffix)); };
  const goals = () => [...d.querySelectorAll('.goal:not(.leaving)')].map((g) => g.querySelector('b').textContent + ' [' + g.querySelector('small').textContent.trim() + ']').join(' ; ');
  const fill = (id, value) => { q('#' + id).value = value; };
  const stops = () => [...d.querySelectorAll('.stop:not(.add-stop)')].map((s) => s.querySelector('b').textContent + ' [' + s.className.replace('stop', '').trim() + ': ' + s.querySelector('small').textContent + ']').join(' ; ');
  const tasks = () => [...d.querySelectorAll('.tasks input')].map((c) => (c.checked ? '[x] ' : '[ ] ') + c.closest('label').textContent.trim()).join(' ; ');
  const progress = () => q('#road-progress').textContent.replace(/\s+/g, ' ').trim();

  const entries = () => [...d.querySelectorAll('.entries li')].map((li) => li.querySelector('span').textContent.replace(/\s+/g, ' ').trim() + ' = ' + li.querySelector('b').textContent).join(' ; ');

  return { d, w, errors, q, tap, node, ids, areas, zoom, sheet, find, tapNode, goals, fill, submit, stops, tasks, progress, strip, habitRows, entries, store: w.fakeStore, auth: w.fakeAuth };
}
async function scenario(name, query, steps, page) {
  const log = [];
  try {
    const t = await open(query, page);
    await steps(t, (label, value) => log.push(label + ': ' + value));
    log.push('script errors: ' + (t.errors.join(' | ') || 'none'));
    log.push('page overflow: ' + (t.d.documentElement.scrollWidth > 390));
  } catch (e) { log.push('ERROR ' + e.message); }
  await report(name, log);

    say('sheet with no connection', t.q('#sheet-error').textContent + ' | ' + t.habitRows()); t.store.failing = false;
    t.d.querySelectorAll('.habit-list [data-edit]')[1].click(); say('edit form', t.sheet().querySelector('h2').textContent + ' / ' + t.q('#f-name').value + ' / ' + t.q('#f-often').value);
    t.fill('f-name', 'Gym <b>session</b>'); t.fill('f-often', '7'); await t.submit(500);
    say('edited', t.habitRows() + ' | tags stayed text: ' + !t.q('.habit-list b'));
    t.d.querySelectorAll('.habit-list [data-edit]')[0].click(); t.tap('[data-act="ask-delete"]'); say('delete asks', t.q('#sheet-danger p').textContent);
    t.tap('[data-act="delete"]'); await wait(500);
    say('deleted', t.habitRows() + ' | strip: ' + t.strip() + ' | check-ins left: ' + t.store.rows('habit_checkins').length);
    t.tap('[data-act="close"]');
    say('controls clear of the strip', 'zoom bottom ' + Math.round(t.q('.zoom').getBoundingClientRect().bottom) + ' <= strip top ' + Math.round(t.q('#strip').getBoundingClientRect().top));
    say('changes sent', t.store.calls.filter((c) => c !== 'loadAll').join(' ; '));
  });
  await scenario('signin', '?theme=light', async (t, say) => {
    const screen = () => t.q('.card h1').textContent + ' | ' + [...t.d.querySelectorAll('.card button')].map((b) => b.textContent).join(', ');
    say('first screen', screen() + ' | icon loads: ' + (t.q('.brand img').naturalWidth > 0) + ' | browser can fill it: ' + t.q('#email').autocomplete + ' + ' + t.q('#password').autocomplete);
    t.fill('email', 'not-an-email'); t.tap('#sign-in [type=submit]'); say('bad email', t.q('#sign-in-error').textContent);
    t.fill('email', 'me@example.com'); t.tap('#sign-in [type=submit]'); say('no password', t.q('#sign-in-error').textContent);
    t.fill('password', 'wrong one'); t.tap('#sign-in [type=submit]'); await wait(200);
    say('wrong password', t.q('#sign-in-error').textContent + ' | button usable again: ' + !t.q('#sign-in [type=submit]').disabled);
    t.auth.limited = true; t.tap('#sign-in [type=submit]'); await wait(200); say('too many tries', t.q('#sign-in-error').textContent); t.auth.limited = false;
    t.auth.offline = true; t.tap('#sign-in [type=submit]'); await wait(200); say('no connection', t.q('#sign-in-error').textContent); t.auth.offline = false;
    t.fill('email', ''); t.tap('#use-link'); say('link with no email', t.q('#sign-in-error').textContent);
    t.fill('email', 'me@example.com'); t.tap('#use-link'); await wait(200);
    say('link sent', screen() + ' | to: ' + t.q('.email').textContent + ' | sent: ' + t.auth.sent.join(','));
    t.tap('#back'); say('back', screen() + ' | kept: ' + t.q('#email').value);
    t.fill('password', 'correct horse'); t.tap('#sign-in [type=submit]'); await wait(200);
    say('right password', 'signed in as ' + t.auth.signedInAs + ' | ' + t.q('.card h1').textContent);
  }, 'signin');
  await scenario('account', '?theme=light', async (t, say) => {
    t.tap('#account'); say('account sheet', t.sheet().textContent.replace(/\s+/g, ' ').trim());
    t.tap('[data-act="password"]'); say('password form', t.sheet().querySelector('h2').textContent + ' | fields: ' + [...t.d.querySelectorAll('#sheet-form input')].map((i) => i.type + '/' + i.autocomplete).join(', '));
    t.fill('f-password', 'short'); t.fill('f-again', 'short'); t.tap('#sheet-form [type=submit]'); await wait(200); say('too short', t.q('#sheet-error').textContent);
    t.fill('f-password', 'long enough 1'); t.fill('f-again', 'long enough 2'); t.tap('#sheet-form [type=submit]'); await wait(200); say('not the same', t.q('#sheet-error').textContent);
    t.store.failing = true; t.fill('f-again', 'long enough 1'); t.tap('#sheet-form [type=submit]'); await wait(200); say('no connection', t.q('#sheet-error').textContent); t.store.failing = false;
    t.tap('#sheet-form [type=submit]'); await wait(200);
    say('saved', t.q('.sheet-note').textContent + ' | password sent: ' + (t.store.password === 'long enough 1') + ' | back on: ' + t.sheet().querySelector('h2').textContent);
  });
  await scenario('empty', '?areas=empty', async (t, say) => {
    say('notice', !t.q('#starter').hidden + ' | ' + t.q('#starter p').textContent);
    t.tap('#add-starters'); await wait(1800);
    say('after starters', t.areas() + ' | notice hidden: ' + t.q('#starter').hidden + ' | zoom ' + t.zoom());
  });
  await scenario('offline', '?fail=1', async (t, say) => {
    say('load fails', t.q('.card h1')?.textContent);
    t.store.failing = false; t.tap('#retry'); await wait(600);
    say('after retry', t.ids());
  });
  await report('done', ['finished']);
})();
</script></body>
